name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Bundle
        run: make bundle

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: com.custom.guest-isolation-*.tar.gz
          generate_release_notes: true
